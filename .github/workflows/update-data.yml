name: Update price data

on:
  schedule:
    - cron: "30 22 * * *"   # daily, after the US close
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch prices
        env:
          REFRESH: "1"
          WORKERS: "2"
          DELAY: "0.8"
        run: python tools/update_data.py
      - name: Commit changes
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update prices $(date -u +%Y-%m-%d)"
            git push
          fi
